<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#081822" />
    </linearGradient>

    <!-- Radial Glow Behind Play Button -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0F766E" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Play Button Gradient -->
    <linearGradient id="playGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Teal Accent Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- Filter for soft drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bgGradient)" />

  <!-- Subtle Ambient Circuit / Grid Lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="720" />
    <line x1="320" y1="0" x2="320" y2="720" />
    <line x1="640" y1="0" x2="640" y2="720" />
    <line x1="960" y1="0" x2="960" y2="720" />
    <line x1="1120" y1="0" x2="1120" y2="720" />
    <line x1="0" y1="180" x2="1280" y2="180" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="540" x2="1280" y2="540" />
  </g>

  <!-- Ambient Care Circle Orbital Rings in Center -->
  <circle cx="640" cy="360" r="300" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.2" />
  <circle cx="640" cy="360" r="210" stroke="#14B8A6" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.3" />
  <circle cx="640" cy="360" r="130" fill="url(#centerGlow)" />

  <!-- Top Brand Lockup -->
  <g transform="translate(80, 60)">
    <!-- Shield Logo Icon -->
    <rect width="48" height="48" rx="12" fill="#0F766E" />
    <path d="M24 8.4C17.04 8.4 13.2 11.76 13.2 17.4C13.2 26.64 21 33.6 24 37.2C27 33.6 34.8 26.64 34.8 17.4C34.8 11.76 30.96 8.4 24 8.4Z" stroke="#FFFFFF" stroke-width="2.64" stroke-linejoin="round" fill="#0D9488" />
    <circle cx="24" cy="18" r="3.84" fill="#FFFFFF" />
    <circle cx="18.24" cy="27" r="2.4" fill="#CCFBF1" />
    <circle cx="29.76" cy="27" r="2.4" fill="#CCFBF1" />
    
    <!-- Wordmark -->
    <text x="64" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      Arogya<tspan fill="#2DD4BF">Mitra</tspan>
    </text>
    
    <!-- EHR Badge -->
    <rect x="225" y="14" width="46" height="22" rx="6" fill="#134E4A" stroke="#0D9488" stroke-width="1" />
    <text x="248" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#5EEAD4" text-anchor="middle" letter-spacing="1">EHR</text>
  </g>

  <!-- Duration Badge Top Right -->
  <g transform="translate(1080, 68)">
    <rect width="120" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="17" r="4" fill="#2DD4BF" />
    <text x="68" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">1-Min Guide</text>
  </g>

  <!-- Center Play Button with Pulsing Ring effect -->
  <g transform="translate(640, 340)" filter="url(#shadow)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="56" fill="#0D9488" opacity="0.25" />
    <!-- Main Play Circle -->
    <circle cx="0" cy="0" r="44" fill="url(#playGradient)" stroke="#5EEAD4" stroke-width="2" />
    <!-- Play Triangle -->
    <polygon points="-8,-16 16,0 -8,16" fill="#FFFFFF" />
  </g>

  <!-- Title & Walkthrough Overview -->
  <text x="640" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">
    How ArogyaMitra Works
  </text>
  
  <text x="640" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Patient Data Sovereignty • Granular Consent Sharing • Connected Care Circle
  </text>

  <!-- 4 Step Mini Flow Indicator along Bottom -->
  <g transform="translate(240, 560)">
    <!-- Step 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="64" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" opacity="0.9" />
      <text x="18" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2DD4BF">STEP 1</text>
      <text x="18" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">Grant Consent</text>
    </g>

    <!-- Connector 1 -->
    <path d="M195 32 L215 32" stroke="#475569" stroke-width="2" stroke-linecap="round" />

    <!-- Step 2 -->
    <g transform="translate(225, 0)">
      <rect width="180" height="64" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" opacity="0.9" />
      <text x="18" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2DD4BF">STEP 2</text>
      <text x="18" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">Doctor Requests</text>
    </g>

    <!-- Connector 2 -->
    <path d="M420 32 L440 32" stroke="#475569" stroke-width="2" stroke-linecap="round" />

    <!-- Step 3 -->
    <g transform="translate(450, 0)">
      <rect width="180" height="64" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" opacity="0.9" />
      <text x="18" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2DD4BF">STEP 3</text>
      <text x="18" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">Approve or Revoke</text>
    </g>

    <!-- Connector 3 -->
    <path d="M645 32 L665 32" stroke="#475569" stroke-width="2" stroke-linecap="round" />

    <!-- Step 4 -->
    <g transform="translate(675, 0)">
      <rect width="180" height="64" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" opacity="0.9" />
      <text x="18" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2DD4BF">STEP 4</text>
      <text x="18" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">Synchronized Care</text>
    </g>
  </g>
</svg>
